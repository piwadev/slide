<!doctype html><html><head><meta charset="utf-8"><style>
@font-face{font-family:Bangers;src:url(../fonts/Bangers-Regular.ttf)}@font-face{font-family:Knewave;src:url(../fonts/Knewave-Regular.ttf)}@font-face{font-family:'Permanent Marker';src:url(../fonts/PermanentMarker-Regular.ttf)}@font-face{font-family:'Rubik Spray Paint';src:url(../fonts/RubikSprayPaint-Regular.ttf)}
body{margin:0;background:#000}canvas{display:block;width:100vw;height:100vh}</style>
<script type="importmap">{"imports":{"three":"../js/vendor/three.module.js","three/addons/":"../js/vendor/jsm/"}}</script></head><body><canvas id="c"></canvas>
<script type="module">
import { Stage } from '../js/render/stage.js';
import { GarageScene } from '../js/render/garage.js';
import { carById } from '../js/data/cars.js';
import { defaultCfg } from '../js/data/parts.js';
const q = new URLSearchParams(location.search);
await Promise.all(['Bangers','Knewave','Permanent Marker','Rubik Spray Paint'].map(f => document.fonts.load(`80px "${f}"`)));
const stage = new Stage(document.getElementById('c'), q.get('q')||'high');
const g = new GarageScene(stage); const car = carById[q.get('car')||'s13']; const cfg = defaultCfg(car);
if (q.get('cfg')) { const j = JSON.parse(q.get('cfg')); for (const k in j) Object.assign(cfg[k], j[k]); }
g.setCar(car, cfg); g.enter(); g.go(q.get('view')||'hero', true); g.auto = false; g.view.a = parseFloat(q.get('a')||'0.62'); g.tgt.a = g.view.a;
if (q.get('off')) { g.offsetX = g.offsetTarget = parseFloat(q.get('off')); }
window.g = g; for (let i=0;i<3;i++){ g.update(0.016); g.render(); }
setTimeout(()=>{ g.update(0.016); g.render(); window.done = true; }, 300);
</script></body></html>
