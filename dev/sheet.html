<script type=module>
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import { MeshoptDecoder } from 'three/addons/libs/meshopt_decoder.module.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';
const q = new URLSearchParams(location.search); const files = q.get('f').split(','); const W = +(q.get('w')||480), H = +(q.get('h')||300), dbg = q.get('dbg')==='1', cols = +(q.get('cols')||4);
const cv = document.getElementById('c'); cv.width = W*cols; cv.height = H*Math.ceil(files.length/cols); const g = cv.getContext('2d'); g.fillStyle='#2b2b30'; g.fillRect(0,0,cv.width,cv.height);

const loader = new GLTFLoader(); loader.setMeshoptDecoder(MeshoptDecoder);

for (let i = 0; i < files.length; i++) {
  try {

    const cam = new THREE.PerspectiveCamera(30, W/H, 0.1, 500); const d = Math.max(sz.x, sz.y, sz.z) * 2.1; cam.position.set(c.x + d*0.75, c.y + d*0.3, c.z + d*0.65); cam.lookAt(c);
    const dl = new THREE.DirectionalLight('#fff', 1.5); dl.position.set(5, 10, 5); s.add(dl);
    r.render(s, cam); g.drawImage(r.domElement, (i%cols)*W, Math.floor(i/cols)*H);
    g.fillStyle = '#fff'; g.font = '14px sans-serif'; g.fillText(files[i].split('/').pop().slice(0,50) + '  ' + sz.x.toFixed(1)+'x'+sz.y.toFixed(1)+'x'+sz.z.toFixed(1), (i%cols)*W+6, Math.floor(i/cols)*H+16);
    legend.forEach(([n,c],j)=>{ g.fillStyle=c; g.font='13px monospace'; g.fillText(n,(i%cols)*W+W-150,Math.floor(i/cols)*H+30+j*14); });

}
window.__done = true;
</script>
